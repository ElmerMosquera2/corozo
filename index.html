<!doctype html>
<html lang="es" data-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta
            name="description"
            content="Corozo: Diseñador de presentaciones HTML exportables desde Markdown"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Corozo Presentation Studio</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Caveat:wght@600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Nunito:wght@500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/index.css" />
    </head>
    <body>
        <header class="header">
            <div class="header__logo">
                <span class="logo-icon">C</span>
                <div>
                    <h1>Corozo</h1>
                    <span>Presentation Studio</span>
                </div>
            </div>
            <div class="header__actions">
                <button id="btnToggleEditor" class="btn--ghost">Editor</button>
                <button id="btnNew">Nuevo</button>
                <button>Abrir</button>
                <button>Guardar</button>
                <button id="btnExportHtml" class="btn--primary">
                    Exportar HTML
                </button>
            </div>
        </header>

        <nav class="ribbon">
            <a href="#" data-tab="inicio">Inicio</a>
            <a href="#" style="display:none" data-tab="archivo">Archivo</a>
            <a href="#" style="display:none" data-tab="insertar">Insertar</a>
            <a href="#" style="display:none" data-tab="diseno">Diseño</a>
            <a href="#" style="display:none" data-tab="temas">Temas</a>
            <a href="#" style="display:none" data-tab="animaciones">Animaciones</a>
            <a href="#" style="display:none" data-tab="transiciones">Transiciones</a>
            <a href="#" style="display:none" data-tab="presentar">Presentar</a>
            <a href="#" style="display:none" data-tab="exportar">Exportar</a>
            <a href="#" style="display:none" data-tab="ayuda">Ayuda</a>
        </nav>

        <div class="ribbon-panel"></div>

        <div class="app">
            <aside class="rail">
                <div class="mark"><b>Corozo</b><br>Presentation Studio</div>
                <div class="rail-divider"></div>
                <ul class="progress-list" id="progressList"></ul>
                <div class="signal-box">
                    <div class="signal-caption"><span>Señal</span><span id="signalState">ruido</span></div>
                    <svg class="wave" id="waveSvg" viewBox="0 0 240 46" preserveAspectRatio="none"></svg>
                </div>
            </aside>

            <div class="stage">
                <div class="slides" id="slidesContainer"></div>
                <div class="controls">
                    <button class="nav-btn" id="prevBtn">&larr; Anterior</button>
                    <button class="nav-btn" id="nextBtn">Siguiente &rarr;</button>
                    <span class="hint">usa las flechas del teclado</span>
                    <span class="counter" id="slideCounter"></span>
                </div>
            </div>
        </div>

        <div class="editor-overlay" id="editorOverlay">
            <div class="editor-header">
                <h3>Markdown</h3>
                <button class="editor-close" id="btnCloseEditor">&times;</button>
            </div>
            <textarea id="markdownInput" placeholder="# T&#237;tulo&#10;Contenido de la diapositiva..." spellcheck="false"></textarea>
        </div>

        <script type="module" src="js/app.js"></script>
    </body>
</html>
